<script>
const D=JSON.parse(document.getElementById('datos').textContent);
const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LS='mce_tp_frase';
async function abrir(frase){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(frase),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(D.salt),iterations:D.it,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
  const claro=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(D.iv)},key,b2a(D.ct));
  const html=new TextDecoder().decode(claro);
  try{localStorage.setItem(LS,frase)}catch(_){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'), e=document.getElementById('e');
  b.disabled=true; b.textContent='Descifrando...'; e.style.display='none';
  try{ await abrir(document.getElementById('p').value); }
