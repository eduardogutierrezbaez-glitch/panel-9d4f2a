<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tablero privado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#343059;color:#fff;min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:24px}
.caja{background:#fff;color:#1a1a1a;border-radius:10px;padding:28px;max-width:380px;width:100%;
border-top:5px solid #853730}
h1{font-size:17px;color:#343059;margin-bottom:4px}
p{font-size:13px;color:#666;margin-bottom:16px;line-height:1.5}
input{width:100%;padding:11px 12px;font-size:16px;border:1px solid #ccc;border-radius:6px;font-family:inherit}
button{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:700;color:#fff;
background:#343059;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#853730;font-size:13px;margin-top:10px;font-weight:700;display:none}
</style></head><body>
<div class="caja">
<h1>Tablero de Productos</h1>
<p>Contenido cifrado. Escribe la frase de acceso para verlo.</p>
<form id="f"><input id="p" type="password" placeholder="Frase de acceso" autocomplete="current-password" autofocus>
<button id="b" type="submit">Abrir</button></form>
<div class="err" id="e">Frase incorrecta.</div>
</div>
<script type="application/json" id="datos">{"v": 1, "it": 250000, "salt": "7wYdvc6qEibQmdhdNzX4/g==", "iv": "y+GUHs2z3KM4JHl9"}</script>
<script>
const D=JSON.parse(document.getElementById('datos').textContent);
const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LS='mce_tp_frase';
const PARTS=['parts/ct0.txt','parts/ct1.txt','parts/ct2.txt','parts/ct3.txt','parts/ct4.txt','parts/ct5.txt'];
async function cargarCt(){
  const resp=await Promise.all(PARTS.map(u=>fetch(u).then(r=>r.text())));
  return resp.join('');
}
async function abrir(frase){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(frase),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(D.salt),iterations:D.it,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
  const ct=await cargarCt();
  const claro=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(D.iv)},key,b2a(ct));
  const html=new TextDecoder().decode(claro);
  try{localStorage.setItem(LS,frase)}catch(_){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'), e=document.getElementById('e');
  b.disabled=true; b.textContent='Descifrando...'; e.style.display='none';
  try{ await abrir(document.getElementById('p').value); }
  catch(_){ e.style.display='block'; b.disabled=false; b.textContent='Abrir';
            try{localStorage.removeItem(LS)}catch(_){} }
});
(async()=>{ let g=null; try{g=localStorage.getItem(LS)}catch(_){}
  if(g){ try{ await abrir(g); }catch(_){ try{localStorage.removeItem(LS)}catch(_){} } } })();
</script></body></html>
